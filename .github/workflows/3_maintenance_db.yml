name: "Workflow 3: data 分支自主去重整理 (DB Maintenance)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  db_maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: 严格检出数据中台 (data 分支)
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: 执行全量数据去重与双层路由重构
        run: |
          python << 'EOF'
          import os, glob, shutil

          db_dir = "data"
          all_records = {}

          if os.path.exists(db_dir):
              txt_files = glob.glob(f"{db_dir}/*/*.txt") + glob.glob(f"{db_dir}/*.txt")
              print(f"📂 找到现有数据库文件共计: {len(txt_files)} 个，开始进行全量提取...")
              
              for f in txt_files:
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          text = line.strip()
                          if not text:
                              continue
                          # 【核心适配】：maxsplit=1
                          parts = text.split(maxsplit=1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              cid = int(parts[0])
                              all_records[cid] = text
          else:
              print("❌ 错误：未找到 data/ 文件夹，请确认分支是否正确。")
              import sys
              sys.exit(1)

          total_before = len(all_records)
          print(f"🧹 提取完毕，全量去重后共有 {total_before} 个唯一班级记录。")

          sorted_cids = sorted(all_records.keys())

          if os.path.exists(db_dir):
              shutil.rmtree(db_dir)
          os.makedirs(db_dir, exist_ok=True)

          chunk_size = 1200       
          files_per_folder = 100  
          
          total_files = 0
          folder_idx = 0
          
          for i in range(0, len(sorted_cids), chunk_size):
              chunk = sorted_cids[i:i+chunk_size]
              
              file_idx = i // chunk_size                
              folder_idx = file_idx // files_per_folder 
              
              folder_path = f"{db_dir}/{folder_idx:03d}"
              os.makedirs(folder_path, exist_ok=True)
              
              filename = f"{folder_path}/class_{file_idx:04d}.txt"
              with open(filename, 'w', encoding='utf-8') as f:
                  for cid in chunk:
                      f.write(all_records[cid] + "\n")
              total_files = file_idx + 1

          print(f"====================================")
          print(f"✨ 数据库自主全量重构大扫除完成！")
          print(f"====================================")
          print(f"▶️ 整理后总有效记录规模: {len(sorted_cids)} 条")
          print(f"▶️ 重新划分规范子文件夹: {folder_idx + 1 if sorted_cids else 0} 个")
          print(f"▶️ 全量导出规范文件总数: {total_files} 个 (单文件上限 1200 条)")
          EOF

      - name: 提交规范化后的数据并推回 data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git reset
          git add data/
          
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          if git commit -m "🧹 数据库全量深度去重与百万级双层路由重构: $COMMIT_TIME [skip ci]"; then
            git push origin data
            echo "🎉 data 分支已顺利完成大扫除，全量双层分桶架构已就位！"
          else
            echo "⚠️ 检查完毕：当前数据库已经是完美去重、排序且符合双层分桶规范的状态，无需任何变更。"
          fi
