name: "Workflow 3: data 分支自主去重整理 (DB Maintenance)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  db_maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: 严格检出数据中台 (data 分支)
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: 执行全量数据去重与重排切割
        run: |
          python << 'EOF'
          import os, glob

          db_dir = "data"
          all_records = {}

          # 1. 全量扫描当前 data/ 文件夹下的所有历史文本
          if os.path.exists(db_dir):
              txt_files = glob.glob(f"{db_dir}/*.txt")
              print(f"📂 找到现有数据库文件共计: {len(txt_files)} 个")
              
              for f in txt_files:
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          text = line.strip()
                          if not text:
                              continue
                          parts = text.split(' ', 1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              cid = int(parts[0])
                              # 以 CID 为 Key 放入字典，天然实现全量去重
                              # 如果有完全相同的 CID，后读出的行会覆盖前面的行
                              all_records[cid] = text
          else:
              print("❌ 错误：未找到 data/ 文件夹，请确认分支是否正确。")
              import sys
              sys.exit(1)

          total_before = len(all_records)
          print(f"🧹 提取完毕，去重后共有 {total_before} 个唯一班级记录。")

          # 2. 严格按照 CID 数字从小到大进行全量升序排序
          sorted_cids = sorted(all_records.keys())

          # 3. 彻底清空旧的 data/ 文件夹（格式化旧文件，防止旧残余污染）
          for f in glob.glob(f"{db_dir}/*.txt"):
              os.remove(f)
          os.makedirs(db_dir, exist_ok=True)

          # 4. 碎片整理：严格按照每 1200 行一个文件的规则重新分箱写入
          chunk_size = 1200
          total_files = 0
          
          for i in range(0, len(sorted_cids), chunk_size):
              chunk = sorted_cids[i:i+chunk_size]
              file_idx = (i // chunk_size) + 1
              filename = f"{db_dir}/class_{file_idx:03d}.txt"
              
              with open(filename, 'w', encoding='utf-8') as f:
                  for cid in chunk:
                      f.write(all_records[cid] + "\n")
              total_files = file_idx

          print(f"====================================")
          print(f"✨ 数据库维护完成！")
          print(f"====================================")
          print(f"▶️ 整理后总有效记录: {len(sorted_cids)} 条")
          print(f"▶️ 重新生成规范文件: {total_files} 个 (每文件最多600条)")
          EOF

      - name: 提交规范化后的数据并推回 data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 将所有新生成的文件变化加入暂存区
          git add data/
          
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          if git commit -m "🧹 数据库全量深度去重与碎片重构: $COMMIT_TIME [skip ci]"; then
            git push origin data
            echo "🎉 data 分支已大扫除完毕，干净的数据已成功推回！"
          else
            echo "⚠️ 检查完毕：当前数据库已经是完美去重且排序的状态，无需任何变更。"
          fi
