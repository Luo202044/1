name: ClassIn Scanner (Sharded)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量 (默认4)'
        required: true
        default: '4'

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      start_cid: ${{ steps.read_config.outputs.start_cid }}
      end_cid: ${{ steps.read_config.outputs.end_cid }}
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取原始 config.json
        id: read_config
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          echo "start_cid=${START}" >> $GITHUB_OUTPUT
          echo "end_cid=${END}" >> $GITHUB_OUTPUT
          echo "原始范围: ${START} ~ ${END}"

      - name: 计算分片区间并生成配置片段 (Python)
        id: calc_shards
        run: |
          START=${{ steps.read_config.outputs.start_cid }}
          END=${{ steps.read_config.outputs.end_cid }}
          SHARDS=${{ github.event.inputs.shards }}
          
          python << 'EOF'
          import json, math, os
          
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          print(f"总班级数: {total}, 分片数: {shards}, 每片约 {shard_size} 个班级")
          
          with open('config.json', 'r') as f:
              orig = json.load(f)
          
          shard_indices = []
          shard_configs = []
          
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1) * shard_size - 1, end)
              shard_indices.append(str(i))
              shard_configs.append({
                  "start_cid": s,
                  "end_cid": e,
                  "threads": orig["threads"],
                  "max_tasks_per_driver": orig["max_tasks_per_driver"],
                  "wait_timeout": orig["wait_timeout"],
                  "render_wait": orig["render_wait"],
                  "sleep_between": orig["sleep_between"]
              })
              print(f"分片 {i} : {s} ~ {e}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
          EOF

  scan_shard:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取当前分片的配置
        id: get_config
        run: |
          CONFIGS='${{ needs.master.outputs.shard_configs }}'
          IDX=${{ matrix.shard_idx }}
          CONFIG=$(echo "$CONFIGS" | jq -c ".[${IDX}]")
          echo "config=${CONFIG}" >> $GITHUB_OUTPUT

      - name: 生成当前分片的 config.json
        run: |
          echo '${{ steps.get_config.outputs.config }}' | jq . > config.json
          cat config.json

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install selenium webdriver-manager psutil

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 运行扫描脚本
        run: python scanner.py

      - name: 上传分片结果
        uses: actions/upload-artifact@v4
        with:
          name: result-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: scan_shard
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有分片结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并结果文件
        run: |
          mkdir -p data
          START=${{ needs.master.outputs.start_cid }}
          END=${{ needs.master.outputs.end_cid }}
          OUTPUT_FILE="data/${START}-${END}.txt"
          > "$OUTPUT_FILE"
          find artifacts -name "*.txt" -exec cat {} \; >> "$OUTPUT_FILE"
          echo "合并完成，文件行数: $(wc -l < "$OUTPUT_FILE")"

      - name: 提交并推送结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "合并分片扫描结果: ${{ needs.master.outputs.start_cid }}-${{ needs.master.outputs.end_cid }} [skip ci]" || echo "无变更"
          git push
