name: ClassIn Scanner (Sharded)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量 (默认4)'
        required: true
        default: '4'

permissions:
  contents: write

jobs:
  # ========== 1. 主控 Job：读取 config.json，计算分片范围 ==========
  master:
    runs-on: ubuntu-latest
    outputs:
      start_cid: ${{ steps.read_config.outputs.start_cid }}
      end_cid: ${{ steps.read_config.outputs.end_cid }}
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取原始 config.json
        id: read_config
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          echo "start_cid=${START}" >> $GITHUB_OUTPUT
          echo "end_cid=${END}" >> $GITHUB_OUTPUT
          echo "原始范围: ${START} ~ ${END}"

      - name: 计算分片区间并生成配置片段
        id: calc_shards
        run: |
          START=${{ steps.read_config.outputs.start_cid }}
          END=${{ steps.read_config.outputs.end_cid }}
          SHARDS=${{ github.event.inputs.shards }}
          TOTAL=$((END - START + 1))
          SHARD_SIZE=$(( (TOTAL + SHARDS - 1) / SHARDS ))
          echo "总班级数: ${TOTAL}, 分片数: ${SHARDS}, 每片约 ${SHARD_SIZE} 个班级"

          # 读取其他固定参数（线程数等）
          THREADS=$(jq -r '.threads' config.json)
          MAX_TASKS=$(jq -r '.max_tasks_per_driver' config.json)
          TIMEOUT=$(jq -r '.wait_timeout' config.json)
          RENDER_WAIT=$(jq -r '.render_wait' config.json)
          SLEEP=$(jq -r '.sleep_between' config.json)

          SHARD_IDS=()
          SHARD_CONFIGS_JSON=""

          for i in $(seq 0 $((SHARDS-1))); do
            SHARD_START=$((START + i * SHARD_SIZE))
            SHARD_END=$((START + (i+1) * SHARD_SIZE - 1))
            if [ $SHARD_END -gt $END ]; then SHARD_END=$END; fi

            # 生成每个分片独立的配置内容（JSON字符串）
            CONFIG=$(jq -n \
              --argjson start "$SHARD_START" \
              --argjson end "$SHARD_END" \
              --argjson threads "$THREADS" \
              --argjson max_tasks "$MAX_TASKS" \
              --argjson timeout "$TIMEOUT" \
              --argjson render_wait "$RENDER_WAIT" \
              --argjson sleep "$SLEEP" \
              '{start_cid: $start, end_cid: $end, threads: $threads, max_tasks_per_driver: $max_tasks, wait_timeout: $timeout, render_wait: $render_wait, sleep_between: $sleep}')
            
            # 将配置放入数组（用于传递给 matrix）
            SHARD_CONFIGS_JSON="${SHARD_CONFIGS_JSON}${SHARD_CONFIGS_JSON:+,}${CONFIG}"
            SHARD_IDS+=("$i")
            echo "分片 $i : ${SHARD_START} ~ ${SHARD_END}"
          done

          # 输出 shard 索引列表（用于 matrix）
          echo "shard_list=$(printf '%s\n' "${SHARD_IDS[@]}" | jq -R . | jq -s .)" >> $GITHUB_OUTPUT
          # 输出每个分片的配置 JSON 数组（按索引顺序）
          echo "shard_configs=[${SHARD_CONFIGS_JSON}]" >> $GITHUB_OUTPUT

      - name: 上传分片配置（可选，便于调试）
        uses: actions/upload-artifact@v4
        with:
          name: shard-configs
          path: config.json
          retention-days: 1

  # ========== 2. 分片扫描 Job (Matrix 并行) ==========
  scan_shard:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 从主控输出的 shard_list 和 shard_configs 中获取对应索引的配置
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取当前分片的配置
        id: get_config
        run: |
          # 从 master 输出的 JSON 数组中取出当前索引的配置
          CONFIGS='${{ needs.master.outputs.shard_configs }}'
          IDX=${{ matrix.shard_idx }}
          CONFIG=$(echo "$CONFIGS" | jq -c ".[${IDX}]")
          echo "config=${CONFIG}" >> $GITHUB_OUTPUT
          echo "当前分片配置: ${CONFIG}"

      - name: 生成当前分片的 config.json
        run: |
          echo '${{ steps.get_config.outputs.config }}' | jq . > config.json
          cat config.json

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install selenium webdriver-manager psutil

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 运行扫描脚本
        run: python scanner.py

      - name: 上传分片结果 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: result-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1

  # ========== 3. 合并所有分片结果并推送到仓库 ==========
  merge:
    needs: scan_shard
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有分片结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并结果文件
        run: |
          mkdir -p data
          # 获取原始范围（来自主控输出）
          START=${{ needs.master.outputs.start_cid }}
          END=${{ needs.master.outputs.end_cid }}
          OUTPUT_FILE="data/${START}-${END}.txt"
          > "$OUTPUT_FILE"   # 清空或新建
          # 遍历所有分片 artifact 中的 txt 文件并合并
          find artifacts -name "*.txt" -exec cat {} \; >> "$OUTPUT_FILE"
          echo "合并完成，文件行数: $(wc -l < "$OUTPUT_FILE")"

      - name: 提交并推送结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "合并分片扫描结果: ${{ needs.master.outputs.start_cid }}-${{ needs.master.outputs.end_cid }} [skip ci]" || echo "无变更"
          git push
