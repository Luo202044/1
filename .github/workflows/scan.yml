name: ClassIn Scanner (Playwright + asyncio)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量（自定义）'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算分片区间并生成配置片段（Python）
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          SHARDS=${{ github.event.inputs.shards }}
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          print(f"总班级数: {total}, 分片数: {shards}, 每片约 {shard_size} 个班级")
          
          with open('config.json', 'r') as f:
              orig = json.load(f)
          
          shard_indices = []
          shard_configs = []
          
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1) * shard_size - 1, end)
              shard_indices.append(str(i))
              shard_cfg = orig.copy()
              shard_cfg["start_cid"] = s
              shard_cfg["end_cid"] = e
              if "max_concurrent" not in shard_cfg:
                  shard_cfg["max_concurrent"] = shard_cfg.get("threads", 30)
              shard_configs.append(shard_cfg)
              print(f"分片 {i} : {s} ~ {e}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
          EOF

  scan_shard:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取当前分片的配置
        id: get_config
        run: |
          CONFIGS='${{ needs.master.outputs.shard_configs }}'
          IDX=${{ matrix.shard_idx }}
          CONFIG=$(echo "$CONFIGS" | jq -c ".[${IDX}]")
          echo "config=${CONFIG}" >> $GITHUB_OUTPUT

      - name: 生成当前分片的 config.json
        run: |
          echo '${{ steps.get_config.outputs.config }}' | jq . > config.json
          cat config.json

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install playwright psutil
          playwright install chromium

      - name: 运行 Playwright 扫描脚本
        run: python scanner_playwright.py

      - name: 上传分片结果（工作流附件）
        uses: actions/upload-artifact@v4
        with:
          name: result-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1

  upload:
    needs: scan_shard
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有分片结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 复制所有结果文件到临时目录
        run: |
          mkdir -p temp_data
          find artifacts -name "*.txt" -exec cp {} temp_data/ \;

      - name: 拆分结果文件（每600行一个文件）
        run: |
          mkdir -p data
          for file in temp_data/*.txt; do
            if [ -f "$file" ]; then
              # 获取文件名（不含路径和扩展名）
              base=$(basename "$file" .txt)
              # 使用 awk 按 600 行拆分，生成 base_1.txt, base_2.txt, ...
              awk -v prefix="data/${base}_" 'NR%600==1 {file=prefix ++c ".txt"} {print > file}' "$file"
              echo "拆分 $file 完成，生成文件数: $(ls data/${base}_*.txt 2>/dev/null | wc -l)"
            fi
          done
          # 清理临时目录
          rm -rf temp_data

      - name: 提交并推送结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Playwright 分片扫描结果（分片数：${{ github.event.inputs.shards }}，每文件≤600行） [skip ci]" || echo "无变更"
          git push
