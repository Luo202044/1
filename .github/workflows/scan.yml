name: ClassIn Scanner (Playwright 无头 Chromium + 4层防漏)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量（自动计算，留空则自动）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
      total_cids: ${{ steps.calc_shards.outputs.total_cids }}
    steps:
      - uses: actions/checkout@v4
      - name: 记录开始时间
        run: |
          date -u +"%Y-%m-%d %H:%M:%S" > start_time.txt
      - name: 上传开始时间
        uses: actions/upload-artifact@v4
        with:
          name: start-time
          path: start_time.txt
          retention-days: 1
      - name: 计算分片配置（动态分片）
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          TOTAL=$((END - START + 1))
          
          if [ $TOTAL -lt 10000 ]; then
            SHARDS=1
          else
            SHARDS=$(( (TOTAL + 49999) / 50000 ))
          fi
          if [ $SHARDS -gt 18 ]; then SHARDS=18; fi
          
          if [ -n "${{ github.event.inputs.shards }}" ]; then
            SHARDS=${{ github.event.inputs.shards }}
          fi
          
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          with open('config.json', encoding='utf-8') as f:
              orig = json.load(f)
          shard_indices = []
          shard_configs = []
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1)*shard_size - 1, end)
              shard_indices.append(str(i))
              cfg = orig.copy()
              cfg['start_cid'] = s
              cfg['end_cid'] = e
              cfg['should_scan'] = True
              shard_configs.append(cfg)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
              out.write(f"total_cids={total}\n")
          EOF

  # ==========================================
  # 【第 1 层】：全量并发大扫荡（使用 Playwright Chromium）
  # ==========================================
  scan_shard_first:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" > config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 恢复 Playwright 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: 安装 Playwright 和 Chromium
        run: |
          pip install playwright psutil
          playwright install chromium
          playwright install-deps chromium
      - name: 第 1 层扫描执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: |
          python scanner_native.py
      - name: 上传有效数据
        uses: actions/upload-artifact@v4
        with:
          name: first-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成信标
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-1-${{ matrix.shard_idx }}
          path: unfinished_cids_${{ matrix.shard_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 【第 2 层】：精准补扫（结构相同，略）
  # ==========================================
  # ... 与之前相同，只需替换每个扫描步骤中的 Obscura 相关步骤为 Playwright 安装与缓存 ...
  # 注意：补扫步骤也需要恢复为 Playwright 安装。