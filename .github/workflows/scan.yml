name: ClassIn Scanner (Obscura 轻量引擎 + 4层防漏)

on:
  workflow_dispatch:
    inputs:
      # 🚀 自动计算分片，不再需要手动输入，但保留输入以便调试
      shards:
        description: '分片数量（自动计算，留空则自动）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
      total_cids: ${{ steps.calc_shards.outputs.total_cids }}
    steps:
      - uses: actions/checkout@v4
      - name: 记录开始时间
        run: |
          date -u +"%Y-%m-%d %H:%M:%S" > start_time.txt
      - name: 上传开始时间
        uses: actions/upload-artifact@v4
        with:
          name: start-time
          path: start_time.txt
          retention-days: 1
      - name: 计算分片配置（动态分片）
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          TOTAL=$((END - START + 1))
          
          # 自动计算分片数：每个分片最多 50000 个 CID，最少 1 个分片，最多 18 个
          if [ $TOTAL -lt 10000 ]; then
            SHARDS=1
          else
            SHARDS=$(( (TOTAL + 49999) / 50000 ))
          fi
          if [ $SHARDS -gt 18 ]; then SHARDS=18; fi
          
          # 如果用户输入了 shards 则覆盖
          if [ -n "${{ github.event.inputs.shards }}" ]; then
            SHARDS=${{ github.event.inputs.shards }}
          fi
          
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          with open('config.json', encoding='utf-8') as f:
              orig = json.load(f)
          shard_indices = []
          shard_configs = []
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1)*shard_size - 1, end)
              shard_indices.append(str(i))
              cfg = orig.copy()
              cfg['start_cid'] = s
              cfg['end_cid'] = e
              cfg['should_scan'] = True
              shard_configs.append(cfg)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
              out.write(f"total_cids={total}\n")
          EOF

  # ==========================================
  # 【第 1 层】：全量并发大扫荡（使用 Obscura）
  # ==========================================
  scan_shard_first:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" > config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 下载 Obscura
        run: |
          curl -L https://github.com/obscura/obscura/releases/latest/download/obscura-linux-x86_64 -o obscura
          chmod +x obscura
      - name: 启动 Obscura CDP 服务
        run: |
          ./obscura serve --port 9222 --stealth &
          sleep 3  # 等待服务就绪
      - name: 安装 Python 依赖（Playwright 用于连接 CDP）
        run: |
          pip install playwright psutil
          # 不需要安装 Chromium 浏览器
      - name: 第 1 层扫描执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: |
          python scanner_native.py
      - name: 上传有效数据
        uses: actions/upload-artifact@v4
        with:
          name: first-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成信标
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-1-${{ matrix.shard_idx }}
          path: unfinished_cids_${{ matrix.shard_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 【第 2 层】：精准补扫
  # ==========================================
  collect_unfinished_1:
    needs: scan_shard_first
    if: success() || failure()
    runs-on: ubuntu-latest
    outputs:
      retry_matrix: ${{ steps.reshard.outputs.retry_matrix }}
    steps:
      - name: 下载未完成名单
        uses: actions/download-artifact@v4
        with:
          pattern: unfinished-1-*
          path: unfinished_raw
          merge-multiple: true
      - name: 动态切分
        id: reshard
        run: |
          python << 'EOF'
          import os, json, math, glob
          all_cids = set()
          if os.path.exists("unfinished_raw"):
              for f in glob.glob("unfinished_raw/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          line = line.strip()
                          if line.isdigit(): all_cids.add(int(line))
          cid_list = sorted(list(all_cids))
          total = len(cid_list)
          retry_matrix = []
          if total > 0:
              shards = min(math.ceil(total / 10000), 18)
              actual_chunk_size = math.ceil(total / shards)
              os.makedirs("retry_chunks", exist_ok=True)
              for i in range(shards):
                  start = i * actual_chunk_size
                  end = min(start + actual_chunk_size, total)
                  if start >= total: break 
                  chunk = cid_list[start:end]
                  with open(f"retry_chunks/retry_{i}.txt", "w", encoding="utf-8") as out:
                      for cid in chunk: out.write(f"{cid}\n")
                  retry_matrix.append(str(i))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"retry_matrix={json.dumps(retry_matrix)}\n")
          EOF
      - name: 上传第2层补扫切片
        if: steps.reshard.outputs.retry_matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: retry-chunks
          path: retry_chunks/
          retention-days: 1

  scan_shard_second:
    needs: [master, collect_unfinished_1]
    if: needs.collect_unfinished_1.outputs.retry_matrix != '[]' && needs.collect_unfinished_1.outputs.retry_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        retry_idx: ${{ fromJson(needs.collect_unfinished_1.outputs.retry_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载补扫名单
        uses: actions/download-artifact@v4
        with:
          name: retry-chunks
          path: retry_chunks
      - name: 生成配置（修复：直接指向 CID 列表文件）
        run: |
          echo '{"should_scan": true, "cid_list_file": "retry_chunks/retry_${{ matrix.retry_idx }}.txt"}' > config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 下载 Obscura
        run: |
          curl -L https://github.com/obscura/obscura/releases/latest/download/obscura-linux-x86_64 -o obscura
          chmod +x obscura
      - name: 启动 Obscura CDP 服务
        run: |
          ./obscura serve --port 9222 --stealth &
          sleep 3
      - name: 安装 Python 依赖
        run: |
          pip install playwright psutil
      - name: 第 2 层扫描执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: retry_${{ matrix.retry_idx }}
        run: |
          python scanner_native.py
      - name: 上传有效数据
        uses: actions/upload-artifact@v4
        with:
          name: second-ok-shard-${{ matrix.retry_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成信标
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-2-${{ matrix.retry_idx }}
          path: unfinished_cids_retry_${{ matrix.retry_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 【第 3 层】：继续补扫（与第2层结构相同）
  # ==========================================
  collect_unfinished_2:
    needs: scan_shard_second
    if: always() && (needs.scan_shard_second.result == 'success' || needs.scan_shard_second.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      retry2_matrix: ${{ steps.reshard2.outputs.retry2_matrix }}
    steps:
      - name: 下载未完成名单
        uses: actions/download-artifact@v4
        with:
          pattern: unfinished-2-*
          path: unfinished_raw_2
          merge-multiple: true
      - name: 动态切分
        id: reshard2
        run: |
          python << 'EOF'
          import os, json, math, glob
          all_cids = set()
          if os.path.exists("unfinished_raw_2"):
              for f in glob.glob("unfinished_raw_2/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          line = line.strip()
                          if line.isdigit(): all_cids.add(int(line))
          cid_list = sorted(list(all_cids))
          total = len(cid_list)
          retry_matrix = []
          if total > 0:
              shards = min(math.ceil(total / 10000), 18)
              actual_chunk_size = math.ceil(total / shards)
              os.makedirs("retry2_chunks", exist_ok=True)
              for i in range(shards):
                  start = i * actual_chunk_size
                  end = min(start + actual_chunk_size, total)
                  if start >= total: break 
                  chunk = cid_list[start:end]
                  with open(f"retry2_chunks/retry2_{i}.txt", "w", encoding="utf-8") as out:
                      for cid in chunk: out.write(f"{cid}\n")
                  retry_matrix.append(str(i))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"retry2_matrix={json.dumps(retry_matrix)}\n")
          EOF
      - name: 上传第3层补扫切片
        if: steps.reshard2.outputs.retry2_matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: retry2-chunks
          path: retry2_chunks/
          retention-days: 1

  scan_shard_third:
    needs: [master, collect_unfinished_2]
    if: needs.collect_unfinished_2.outputs.retry2_matrix != '[]' && needs.collect_unfinished_2.outputs.retry2_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        retry2_idx: ${{ fromJson(needs.collect_unfinished_2.outputs.retry2_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载补扫名单
        uses: actions/download-artifact@v4
        with:
          name: retry2-chunks
          path: retry2_chunks
      - name: 生成配置（修复）
        run: |
          echo '{"should_scan": true, "cid_list_file": "retry2_chunks/retry2_${{ matrix.retry2_idx }}.txt"}' > config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 下载 Obscura
        run: |
          curl -L https://github.com/obscura/obscura/releases/latest/download/obscura-linux-x86_64 -o obscura
          chmod +x obscura
      - name: 启动 Obscura CDP 服务
        run: |
          ./obscura serve --port 9222 --stealth &
          sleep 3
      - name: 安装 Python 依赖
        run: |
          pip install playwright psutil
      - name: 第 3 层扫描执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: retry2_${{ matrix.retry2_idx }}
        run: |
          python scanner_native.py
      - name: 上传有效数据
        uses: actions/upload-artifact@v4
        with:
          name: third-ok-shard-${{ matrix.retry2_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成信标
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-3-${{ matrix.retry2_idx }}
          path: unfinished_cids_retry2_${{ matrix.retry2_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 【第 4 层】：绝地终极清洗
  # ==========================================
  collect_unfinished_3:
    needs: scan_shard_third
    if: always() && (needs.scan_shard_third.result == 'success' || needs.scan_shard_third.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      retry3_matrix: ${{ steps.reshard3.outputs.retry3_matrix }}
    steps:
      - name: 下载未完成名单
        uses: actions/download-artifact@v4
        with:
          pattern: unfinished-3-*
          path: unfinished_raw_3
          merge-multiple: true
      - name: 动态切分
        id: reshard3
        run: |
          python << 'EOF'
          import os, json, math, glob
          all_cids = set()
          if os.path.exists("unfinished_raw_3"):
              for f in glob.glob("unfinished_raw_3/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          line = line.strip()
                          if line.isdigit(): all_cids.add(int(line))
          cid_list = sorted(list(all_cids))
          total = len(cid_list)
          retry_matrix = []
          if total > 0:
              shards = min(math.ceil(total / 10000), 18)
              actual_chunk_size = math.ceil(total / shards)
              os.makedirs("retry3_chunks", exist_ok=True)
              for i in range(shards):
                  start = i * actual_chunk_size
                  end = min(start + actual_chunk_size, total)
                  if start >= total: break 
                  chunk = cid_list[start:end]
                  with open(f"retry3_chunks/retry3_{i}.txt", "w", encoding="utf-8") as out:
                      for cid in chunk: out.write(f"{cid}\n")
                  retry_matrix.append(str(i))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"retry3_matrix={json.dumps(retry_matrix)}\n")
          EOF
      - name: 上传第4层补扫切片
        if: steps.reshard3.outputs.retry3_matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: retry3-chunks
          path: retry3_chunks/
          retention-days: 1

  scan_shard_fourth:
    needs: [master, collect_unfinished_3]
    if: needs.collect_unfinished_3.outputs.retry3_matrix != '[]' && needs.collect_unfinished_3.outputs.retry3_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        retry3_idx: ${{ fromJson(needs.collect_unfinished_3.outputs.retry3_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载补扫名单
        uses: actions/download-artifact@v4
        with:
          name: retry3-chunks
          path: retry3_chunks
      - name: 生成配置（修复）
        run: |
          echo '{"should_scan": true, "cid_list_file": "retry3_chunks/retry3_${{ matrix.retry3_idx }}.txt"}' > config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 下载 Obscura
        run: |
          curl -L https://github.com/obscura/obscura/releases/latest/download/obscura-linux-x86_64 -o obscura
          chmod +x obscura
      - name: 启动 Obscura CDP 服务
        run: |
          ./obscura serve --port 9222 --stealth &
          sleep 3
      - name: 安装 Python 依赖
        run: |
          pip install playwright psutil
      - name: 第 4 层扫描执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: retry3_${{ matrix.retry3_idx }}
        run: |
          python scanner_native.py
      - name: 上传有效数据
        uses: actions/upload-artifact@v4
        with:
          name: fourth-ok-shard-${{ matrix.retry3_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成信标
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-4-${{ matrix.retry3_idx }}
          path: unfinished_cids_retry3_${{ matrix.retry3_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 最终汇总汇报
  # ==========================================
  final_upload:
    needs: [master, scan_shard_first, scan_shard_second, scan_shard_third, scan_shard_fourth]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载所有有效结果
        uses: actions/download-artifact@v4
        with:
          pattern: '*-ok-*'
          path: all_results
          merge-multiple: true
        continue-on-error: true
      - name: 下载未完成名单(第1层)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-1-*'
          path: unfinished_1
          merge-multiple: true
        continue-on-error: true
      - name: 下载未完成名单(第2层)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-2-*'
          path: unfinished_2
          merge-multiple: true
        continue-on-error: true
      - name: 下载未完成名单(第3层)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-3-*'
          path: unfinished_3
          merge-multiple: true
        continue-on-error: true
      - name: 下载未完成名单(第4层)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-4-*'
          path: unfinished_4
          merge-multiple: true
        continue-on-error: true
      - name: 下载开始时间
        uses: actions/download-artifact@v4
        with:
          name: start-time
          path: start_time
        continue-on-error: true
      - name: 统计并生成报告
        run: |
          set -e
          mkdir -p final_data
          VALID_COUNT=0
          if find all_results -name "*.txt" -print0 2>/dev/null | xargs -0 cat > all_merged.txt 2>/dev/null; then
            if [ -s all_merged.txt ]; then
              sort -n -k1 all_merged.txt -o all_merged_sorted.txt
              mv all_merged_sorted.txt all_merged.txt
              VALID_COUNT=$(awk '{print $1}' all_merged.txt | sort -u | wc -l)
              awk 'NR%600==1 {file=sprintf("final_data/part_%03d.txt", ++c)} {print > file}' all_merged.txt
              rm all_merged.txt
            fi
          fi
          
          TOTAL="${{ needs.master.outputs.total_cids }}"
          UNFINISHED_COUNT=0
          
          if ls unfinished_4/*.txt 1> /dev/null 2>&1; then
            cat unfinished_4/*.txt | sort -u > tmp_unfinished
          elif ls unfinished_3/*.txt 1> /dev/null 2>&1; then
            cat unfinished_3/*.txt | sort -u > tmp_unfinished
          elif ls unfinished_2/*.txt 1> /dev/null 2>&1; then
            cat unfinished_2/*.txt | sort -u > tmp_unfinished
          elif ls unfinished_1/*.txt 1> /dev/null 2>&1; then
            cat unfinished_1/*.txt | sort -u > tmp_unfinished
          else
            touch tmp_unfinished
          fi
          
          if [ -s tmp_unfinished ]; then
            UNFINISHED_COUNT=$(wc -l < tmp_unfinished)
          fi
          rm -f tmp_unfinished
          
          SCANNED=$((TOTAL - UNFINISHED_COUNT))
          PERCENT=0
          if [ $TOTAL -gt 0 ]; then
            PERCENT=$(echo "scale=2; $SCANNED * 100 / $TOTAL" | bc)
          fi
          
          END_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          DURATION="未知"
          if [ -f start_time/start_time.txt ]; then
            start_epoch=$(date -u -d "$(cat start_time/start_time.txt)" +%s)
            end_epoch=$(date -u +%s)
            diff=$((end_epoch - start_epoch))
            hours=$((diff / 3600))
            minutes=$(((diff % 3600) / 60))
            DURATION="${hours}小时${minutes}分钟"
          fi
          
          cat > final_data/nto.txt << EOF
          总班级数: $TOTAL
          有效班级: $VALID_COUNT
          完成进度: $PERCENT%
          未扫班级: $UNFINISHED_COUNT
          结束时间: $END_TIME
          工作时间: $DURATION
          EOF
          cat final_data/nto.txt
          
      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final_data/
          if git commit -m "最终扫描结果（Obscura 轻量引擎 4层稳定版） [skip ci]"; then
            git push
          else
            echo "无变更需要提交"
          fi
