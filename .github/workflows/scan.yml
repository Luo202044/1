name: ClassIn Scanner

on:
  workflow_dispatch:

permissions:
  contents: write          # 授予写入权限

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 使用自动生成的令牌

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install selenium webdriver-manager

      - name: 安装 Chrome 浏览器
        run: |
          sudo apt update
          sudo apt install -y chromium-browser

      - name: 运行探测脚本
        run: python scanner.py

      - name: 提交并推送结果到 data 目录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "添加班级探测结果 [skip ci]" || echo "无变更可提交"
          git push
