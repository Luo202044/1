name: ClassIn Scanner (Native Lightpanda 宿主机直连版)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量'
        required: true
        default: '19'

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
      total_cids: ${{ steps.calc_shards.outputs.total_cids }}
    steps:
      - uses: actions/checkout@v4
      - name: 记录开始时间
        run: date -u +"%Y-%m-%d %H:%M:%S" > start_time.txt
      - name: 上传开始时间
        uses: actions/upload-artifact@v4
        with:
          name: start-time
          path: start_time.txt
          retention-days: 1
      - name: 计算分片配置
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          SHARDS=${{ github.event.inputs.shards }}
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          with open('config.json', encoding='utf-8') as f:
              orig = json.load(f)
          shard_indices = []
          shard_configs = []
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1)*shard_size - 1, end)
              shard_indices.append(str(i))
              cfg = orig.copy()
              cfg['start_cid'] = s
              cfg['end_cid'] = e
              cfg['should_scan'] = True
              shard_configs.append(cfg)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
              out.write(f"total_cids={total}\n")
          EOF

  # ==========================================
  # 第一轮：全量并发扫描
  # ==========================================
  scan_shard_first:
    needs: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" > config.json
          
      # 🚀 降维打击：直接下载原生二进制文件，不再用 Docker！
      - name: 下载并后台启动原生 Lightpanda
        run: |
          echo "⬇️ 正在从 GitHub Releases 获取原生二进制文件..."
          # 获取 Linux-amd64 的下载链接
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/lightpanda-io/browser/releases/latest | grep "browser_download_url" | grep "linux_amd64.tar.gz" | cut -d '"' -f 4 | head -n 1)
          
          # 鲁棒性：如果获取失败，使用固定 fallback 版本
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "API 获取失败，使用 fallback 链接"
            DOWNLOAD_URL="https://github.com/lightpanda-io/browser/releases/download/v0.1.1/lightpanda_0.1.1_linux_amd64.tar.gz"
          fi
          
          echo "🔗 URL: $DOWNLOAD_URL"
          wget -qO lightpanda.tar.gz "$DOWNLOAD_URL"
          tar -xzf lightpanda.tar.gz
          
          echo "🚀 正在后台拉起 Native 进程..."
          chmod +x lightpanda
          # 让 lightpanda 在后台监听 9222 端口，并将日志丢入虚无
          nohup ./lightpanda --port=9222 > /dev/null 2>&1 &
          
          echo "⌛ 正在检查端口探针..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:9222/json/version > /dev/null; then
              echo "✅ Native Lightpanda 已在宿主机准备就绪！"
              break
            fi
            sleep 1
          done
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 Python 依赖
        run: pip install playwright psutil
          
      - name: 扫描执行 (Native 零延迟互连)
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: python scanner_lightpanda.py
        
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: first-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传遗留未完成CID
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-1-${{ matrix.shard_idx }}
          path: unfinished_cids_${{ matrix.shard_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 第二轮：收集漏网之鱼并动态分配
  # ==========================================
  collect_unfinished:
    needs: scan_shard_first
    if: success() || failure()
    runs-on: ubuntu-latest
    outputs:
      retry_matrix: ${{ steps.reshard.outputs.retry_matrix }}
    steps:
      - name: 下载未完成名单
        uses: actions/download-artifact@v4
        with:
          pattern: unfinished-1-*
          path: unfinished_raw
          merge-multiple: true
      - name: 切分补扫名单
        id: reshard
        run: |
          python << 'EOF'
          import os, json, math, glob
          all_cids = set()
          if os.path.exists("unfinished_raw"):
              for f in glob.glob("unfinished_raw/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          line = line.strip()
                          if line.isdigit(): all_cids.add(int(line))
          cid_list = sorted(list(all_cids))
          total = len(cid_list)
          retry_matrix = []
          if total > 0:
              shards = min(math.ceil(total / 10000), 20)
              actual_chunk_size = math.ceil(total / shards)
              os.makedirs("retry_chunks", exist_ok=True)
              for i in range(shards):
                  start = i * actual_chunk_size
                  end = min(start + actual_chunk_size, total)
                  if start >= total: break 
                  chunk = cid_list[start:end]
                  with open(f"retry_chunks/retry_{i}.txt", "w", encoding="utf-8") as out:
                      for cid in chunk: out.write(f"{cid}\n")
                  retry_matrix.append(str(i))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"retry_matrix={json.dumps(retry_matrix)}\n")
          EOF
      - name: 上传补扫分片
        if: steps.reshard.outputs.retry_matrix != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: retry-chunks
          path: retry_chunks/
          retention-days: 1

  scan_shard_second:
    needs: [master, collect_unfinished]
    if: needs.collect_unfinished.outputs.retry_matrix != '[]' && needs.collect_unfinished.outputs.retry_matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        retry_idx: ${{ fromJson(needs.collect_unfinished.outputs.retry_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载补扫名单
        uses: actions/download-artifact@v4
        with:
          name: retry-chunks
          path: retry_chunks
      - name: 生成配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[0]" | jq '. + {should_scan: true, cid_list_file: "retry_chunks/retry_${{ matrix.retry_idx }}.txt"}' > config.json
          
      # 第二轮依然拉起原生二进制
      - name: 下载并后台启动原生 Lightpanda
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/lightpanda-io/browser/releases/latest | grep "browser_download_url" | grep "linux_amd64.tar.gz" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://github.com/lightpanda-io/browser/releases/download/v0.1.1/lightpanda_0.1.1_linux_amd64.tar.gz"
          fi
          wget -qO lightpanda.tar.gz "$DOWNLOAD_URL"
          tar -xzf lightpanda.tar.gz
          chmod +x lightpanda
          nohup ./lightpanda --port=9222 > /dev/null 2>&1 &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:9222/json/version > /dev/null; then break; fi; sleep 1
          done
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install playwright psutil
      - name: 补扫执行
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: retry_${{ matrix.retry_idx }}
        run: python scanner_lightpanda.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: second-ok-shard-${{ matrix.retry_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传遗留未完成CID
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-2-${{ matrix.retry_idx }}
          path: unfinished_cids_retry_${{ matrix.retry_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # 最终汇总汇报
  # ==========================================
  final_upload:
    needs: [master, scan_shard_first, scan_shard_second]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载有效结果
        uses: actions/download-artifact@v4
        with:
          pattern: '*-ok-*'
          path: all_results
          merge-multiple: true
        continue-on-error: true
        
      - name: 下载未完成名单(一轮)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-1-*'
          path: unfinished_1
          merge-multiple: true
        continue-on-error: true
        
      - name: 下载未完成名单(二轮)
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-2-*'
          path: unfinished_2
          merge-multiple: true
        continue-on-error: true
        
      - name: 下载开始时间
        uses: actions/download-artifact@v4
        with:
          name: start-time
          path: start_time
        continue-on-error: true
        
      - name: 统计并生成报告
        run: |
          set -e
          mkdir -p final_data
          VALID_COUNT=0
          if find all_results -name "*.txt" -print0 2>/dev/null | xargs -0 cat > all_merged.txt 2>/dev/null; then
            if [ -s all_merged.txt ]; then
              sort -n -k1 all_merged.txt -o all_merged_sorted.txt
              mv all_merged_sorted.txt all_merged.txt
              VALID_COUNT=$(awk '{print $1}' all_merged.txt | sort -u | wc -l)
              awk 'NR%600==1 {file=sprintf("final_data/part_%03d.txt", ++c)} {print > file}' all_merged.txt
              rm all_merged.txt
            fi
          fi
          
          TOTAL="${{ needs.master.outputs.total_cids }}"
          UNFINISHED_COUNT=0
          
          if ls unfinished_2/*.txt 1> /dev/null 2>&1; then
            cat unfinished_2/*.txt | sort -u > tmp_unfinished
          elif ls unfinished_1/*.txt 1> /dev/null 2>&1; then
            cat unfinished_1/*.txt | sort -u > tmp_unfinished
          else
            touch tmp_unfinished
          fi
          
          if [ -s tmp_unfinished ]; then
            UNFINISHED_COUNT=$(wc -l < tmp_unfinished)
          fi
          rm -f tmp_unfinished
          
          SCANNED=$((TOTAL - UNFINISHED_COUNT))
          PERCENT=0
          if [ $TOTAL -gt 0 ]; then
            PERCENT=$(echo "scale=2; $SCANNED * 100 / $TOTAL" | bc)
          fi
          
          END_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          DURATION="未知"
          if [ -f start_time/start_time.txt ]; then
            start_epoch=$(date -u -d "$(cat start_time/start_time.txt)" +%s)
            end_epoch=$(date -u +%s)
            diff=$((end_epoch - start_epoch))
            hours=$((diff / 3600))
            minutes=$(((diff % 3600) / 60))
            DURATION="${hours}小时${minutes}分钟"
          fi
          
          cat > final_data/nto.txt << EOF
          总班级数: $TOTAL
          有效班级: $VALID_COUNT
          完成进度: $PERCENT%
          未扫班级: $UNFINISHED_COUNT
          结束时间: $END_TIME
          工作时间: $DURATION
          EOF
          cat final_data/nto.txt
          
      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final_data/
          if git commit -m "最终扫描结果（Native Lightpanda 直连极速版） [skip ci]"; then
            git push
          else
            echo "无变更需要提交"
          fi
