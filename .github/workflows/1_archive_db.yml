name: "Workflow 1: 整理归档入库 (Archive to DB)"

on: workflow_dispatch

permissions:
  contents: write

jobs:
  consolidate_and_archive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前工作分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 备份新数据并强校验
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/new_data
          
          if [ ! -d "final_data" ]; then
            echo "❌ 致命错误：当前运行的分支 (${{ github.ref_name }}) 下不存在 final_data/ 文件夹！"
            exit 1
          fi

          find final_data/ -maxdepth 1 -name "*.txt" ! -name "nto.txt" -exec cp {} /tmp/new_data/ \;
          
          FILE_COUNT=$(ls -1 /tmp/new_data/*.txt 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ 致命错误：在 final_data/ 中没有提取到任何有效的 .txt 班级文件！"
            exit 1
          fi
          echo "✅ 成功提取了 $FILE_COUNT 个待入库的数据文件。"

          git rm -rf final_data/ || true
          if git commit -m "🧹 数据已移交归档，清空工作区 [skip ci]" ; then
            git push origin ${{ github.ref_name }}
            echo "✅ 当前分支的 final_data 已清理完毕"
          fi

      - name: 切换到 data 分支 (数据中心)
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . || true
            git clean -fdx
          fi

      - name: 运行核心数据库清洗与双层路由分桶引擎
        run: |
          python << 'EOF'
          import os, glob, shutil

          new_data_dir = "/tmp/new_data"
          db_dir = "data"
          all_records = {}

          if os.path.exists(db_dir):
              txt_files = glob.glob(f"{db_dir}/*/*.txt") + glob.glob(f"{db_dir}/*.txt")
              print(f"📂 正在读取和扫描历史数据库文件，共计: {len(txt_files)} 个...")
              for f in txt_files:
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          # 【核心适配】：maxsplit=1 完美兼容空格和 \t 制表符
                          parts = line.strip().split(maxsplit=1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              all_records[int(parts[0])] = line.strip()
          
          initial_count = len(all_records)

          new_count = 0
          if os.path.exists(new_data_dir):
              for f in glob.glob(f"{new_data_dir}/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          # 【核心适配】：maxsplit=1 完美兼容空格和 \t 制表符
                          parts = line.strip().split(maxsplit=1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              all_records[int(parts[0])] = line.strip()
                              new_count += 1

          sorted_cids = sorted(all_records.keys())

          if os.path.exists(db_dir):
              shutil.rmtree(db_dir)
          os.makedirs(db_dir, exist_ok=True)

          chunk_size = 1200       
          files_per_folder = 100  
          
          folder_idx = 0
          for i in range(0, len(sorted_cids), chunk_size):
              chunk = sorted_cids[i:i+chunk_size]
              
              file_idx = i // chunk_size                
              folder_idx = file_idx // files_per_folder 
              
              folder_path = f"{db_dir}/{folder_idx:03d}"
              os.makedirs(folder_path, exist_ok=True)
              
              filename = f"{folder_path}/class_{file_idx:04d}.txt"
              with open(filename, 'w', encoding='utf-8') as f:
                  for cid in chunk:
                      f.write(all_records[cid] + "\n")

          print(f"====================================")
          print(f"📊 百万级双层分桶入库统计报告")
          print(f"====================================")
          print(f"▶️ 历史基础收录总规模: {initial_count} 条")
          print(f"▶️ 本次读取新审查行数: {new_count} 条")
          print(f"▶️ 智能去重洗盘后总规模: {len(sorted_cids)} 条有效数据")
          print(f"▶️ 物理部署分箱子文件夹: {folder_idx + 1 if sorted_cids else 0} 个")
          EOF

      - name: 提交保存到 data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git reset
          git add data/
          
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if git commit -m "🗄️ 数据库百万级双层路由重构入库: $COMMIT_TIME [skip ci]"; then
            git push origin data
            echo "🎉 数据已成功通过 [双层路由分桶] 升级方案安全归档至 data 分支！"
          else
            echo "⚠️ 检查完毕：数据库没有任何数据变化。"
          fi
