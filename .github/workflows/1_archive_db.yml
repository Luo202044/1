name: "Workflow 1: 整理归档入库 (Archive to DB)"

on: workflow_dispatch

permissions:
  contents: write

jobs:
  consolidate_and_archive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前工作分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 备份新数据并清理当前分支
        run: |
          # 1. 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. 排除 nto.txt，提取有效的班级数据
          rm -f final_data/nto.txt || true
          mkdir -p /tmp/new_data
          if [ -d "final_data" ]; then
            cp -r final_data/* /tmp/new_data/ 2>/dev/null || true
            echo "✅ 成功提取待入库数据"
          else
            echo "⚠️ 未找到 final_data 文件夹，可能是已经归档过了。"
            exit 0
          fi

          # 3. 阅后即焚：从当前工作分支删除 final_data 并提交
          git rm -rf final_data/ || true
          if git commit -m "🧹 数据已移交归档，清空工作区 [skip ci]"; then
            git push origin ${{ github.ref_name }}
            echo "✅ 当前分支的 final_data 已清理完毕"
          fi

      - name: 切换到 data 分支
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "✅ 发现已存在的 data 分支，正在切换..."
            git checkout data
          else
            echo "🆕 data 分支不存在，正在创建纯净数据中心..."
            git checkout --orphan data
            git rm -rf . || true
            git clean -fdx
          fi

      - name: 运行核心数据库清洗引擎
        run: |
          python << 'EOF'
          import os, glob

          new_data_dir = "/tmp/new_data"
          db_dir = "data"
          all_records = {}

          # 1. 挂载历史数据库数据
          if os.path.exists(db_dir):
              for f in glob.glob(f"{db_dir}/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          parts = line.strip().split(' ', 1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              all_records[int(parts[0])] = line.strip()
          
          initial_count = len(all_records)

          # 2. 挂载最新审查完的数据（覆盖历史同 CID 数据）
          new_count = 0
          if os.path.exists(new_data_dir):
              for f in glob.glob(f"{new_data_dir}/*.txt"):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          parts = line.strip().split(' ', 1)
                          if len(parts) >= 1 and parts[0].isdigit():
                              all_records[int(parts[0])] = line.strip()
                              new_count += 1

          # 3. 严格按 CID 数字大小进行升序排序
          sorted_cids = sorted(all_records.keys())

          # 4. 格式化旧磁盘
          os.makedirs(db_dir, exist_ok=True)
          for f in glob.glob(f"{db_dir}/*.txt"):
              os.remove(f)

          # 5. 碎片整理：严格按 600 行/文件 进行写盘
          chunk_size = 600
          for i in range(0, len(sorted_cids), chunk_size):
              chunk = sorted_cids[i:i+chunk_size]
              file_idx = (i // chunk_size) + 1
              filename = f"{db_dir}/class_{file_idx:03d}.txt"
              with open(filename, 'w', encoding='utf-8') as f:
                  for cid in chunk:
                      f.write(all_records[cid] + "\n")

          print(f"====================================")
          print(f"📊 入库统计报告")
          print(f"====================================")
          print(f"历史记录数: {initial_count}")
          print(f"本次新入库/更新数: {new_count}")
          print(f"去重后总收录规模: {len(sorted_cids)} 个有效班级")
          EOF

      - name: 提交保存到 data 分支
        run: |
          git add data/
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if git commit -m "🗄️ 数据库更新与大扫除: $COMMIT_TIME [skip ci]"; then
            git push origin data
            echo "🎉 数据已成功归档至 data 分支！"
          else
            echo "⚠️ 数据库没有任何数据变化。"
          fi
