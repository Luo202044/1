name: ClassIn Scanner 2.0 (Auto Retry + Statistics)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
      total_cids: ${{ steps.calc_shards.outputs.total_cids }}
    steps:
      - uses: actions/checkout@v4
      - name: 记录开始时间
        run: date -u +"%Y-%m-%d %H:%M:%S" > start_time.txt
      - name: 上传开始时间
        uses: actions/upload-artifact@v4
        with:
          name: start-time
          path: start_time.txt
          retention-days: 1
      - name: 计算分片配置
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          SHARDS=${{ github.event.inputs.shards }}
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          with open('config.json') as f:
              orig = json.load(f)
          shard_indices = []
          shard_configs = []
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1)*shard_size - 1, end)
              shard_indices.append(str(i))
              cfg = orig.copy()
              cfg['start_cid'] = s
              cfg['end_cid'] = e
              cfg['should_scan'] = True
              shard_configs.append(cfg)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
              out.write(f"total_cids={total}\n")
          EOF

  scan_shard_first:
    needs: master
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成分片配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" > config.json
          cat config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 缓存 Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
      - name: 安装依赖
        run: |
          pip install playwright psutil
          playwright install chromium
      - name: 扫描
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: python scanner_playwright.py
      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: first-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成标志
        uses: actions/upload-artifact@v4
        with:
          name: flag-${{ matrix.shard_idx }}
          path: unfinished_${{ matrix.shard_idx }}.flag
          if-no-files-found: ignore
          retention-days: 1
      - name: 上传未完成CID列表
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-cids-${{ matrix.shard_idx }}
          path: unfinished_cids_${{ matrix.shard_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  collect_unfinished:
    needs: scan_shard_first
    runs-on: ubuntu-latest
    outputs:
      retry_list: ${{ steps.retry.outputs.retry_list }}
    steps:
      - name: 下载标志
        uses: actions/download-artifact@v4
        with:
          pattern: flag-*
          path: flags
          merge-multiple: false
      - name: 解析需要重跑的分片
        id: retry
        run: |
          cat > /tmp/get_retry.py << 'EOF'
          import os, json, glob, sys
          retry_indices = []
          flags_dir = "flags"
          if os.path.isdir(flags_dir):
              for dirpath in glob.glob(f"{flags_dir}/flag-*/"):
                  if glob.glob(os.path.join(dirpath, "unfinished_*")):
                      idx = os.path.basename(dirpath.rstrip('/')).replace('flag-', '')
                      retry_indices.append(idx)
          output = json.dumps(retry_indices)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"retry_list={output}\n")
          EOF
          python3 /tmp/get_retry.py

  scan_shard_second:
    needs: [master, collect_unfinished]
    if: fromJson(needs.collect_unfinished.outputs.retry_list).length > 0
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.collect_unfinished.outputs.retry_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成补扫配置
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" | jq '. + {should_scan: true}' > config.json
          cat config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 恢复 Playwright 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
      - name: 安装依赖
        run: |
          pip install playwright psutil
          playwright install chromium
      - name: 补扫
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: python scanner_playwright.py
      - name: 上传补扫结果
        uses: actions/upload-artifact@v4
        with:
          name: second-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传补扫未完成CID
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-cids-${{ matrix.shard_idx }}
          path: unfinished_cids_${{ matrix.shard_idx }}.txt
          if-no-files-found: ignore
          retention-days: 1

  final_upload:
    needs: [master, scan_shard_first, scan_shard_second]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载有效结果
        uses: actions/download-artifact@v4
        with:
          pattern: '*-ok-*'
          path: all_results
          merge-multiple: true
        continue-on-error: true
      - name: 下载未完成CID列表
        uses: actions/download-artifact@v4
        with:
          pattern: 'unfinished-cids-*'
          path: unfinished_lists
          merge-multiple: true
        continue-on-error: true
      - name: 下载开始时间
        uses: actions/download-artifact@v4
        with:
          name: start-time
          path: start_time
        continue-on-error: true
      - name: 统计并生成报告
        run: |
          set -e
          mkdir -p final_data
          VALID_COUNT=0
          if find all_results -name "*.txt" -print0 2>/dev/null | xargs -0 cat > all_merged.txt 2>/dev/null; then
            if [ -s all_merged.txt ]; then
              VALID_COUNT=$(cut -d' ' -f1 all_merged.txt | sort -u | wc -l)
              awk 'NR%600==1 {file=sprintf("final_data/part_%03d.txt", ++c)} {print > file}' all_merged.txt
              rm all_merged.txt
            fi
          fi
          TOTAL="${{ needs.master.outputs.total_cids }}"
          UNFINISHED_COUNT=0
          if find unfinished_lists -name "*.txt" -print0 2>/dev/null | xargs -0 cat 2>/dev/null | sort -u > tmp_unfinished; then
            UNFINISHED_COUNT=$(wc -l < tmp_unfinished)
            rm tmp_unfinished
          fi
          SCANNED=$((TOTAL - UNFINISHED_COUNT))
          PERCENT=0
          if [ $TOTAL -gt 0 ]; then
            PERCENT=$(echo "scale=2; $SCANNED * 100 / $TOTAL" | bc)
          fi
          END_TIME=$(date -u +"%Y-%m-%d %H:%M:%S")
          DURATION="未知"
          if [ -f start_time/start_time.txt ]; then
            start_epoch=$(date -u -d "$(cat start_time/start_time.txt)" +%s)
            end_epoch=$(date -u +%s)
            diff=$((end_epoch - start_epoch))
            hours=$((diff / 3600))
            minutes=$(((diff % 3600) / 60))
            DURATION="${hours}小时${minutes}分钟"
          fi
          cat > nto.txt << EOF
          总班级数: $TOTAL
          有效班级: $VALID_COUNT
          完成进度: $PERCENT%
          未扫班级: $UNFINISHED_COUNT
          结束时间: $END_TIME
          工作时间: $DURATION
          EOF
          cat nto.txt
          cp nto.txt final_data/
      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final_data/
          if git commit -m "最终扫描结果（自动合并+拆分+统计报告） [skip ci]"; then
            git push
          else
            echo "无变更需要提交"
          fi
