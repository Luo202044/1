name: ClassIn Scanner 2.0 (Auto Retry)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数量'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  master:
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.calc_shards.outputs.shard_list }}
      shard_configs: ${{ steps.calc_shards.outputs.shard_configs }}
    steps:
      - uses: actions/checkout@v4
      - name: 计算分片区间并生成配置
        id: calc_shards
        run: |
          START=$(jq -r '.start_cid' config.json)
          END=$(jq -r '.end_cid' config.json)
          SHARDS=${{ github.event.inputs.shards }}
          export START END SHARDS
          python << 'EOF'
          import json, math, os
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          shards = int(os.environ['SHARDS'])
          total = end - start + 1
          shard_size = math.ceil(total / shards)
          with open('config.json') as f:
              orig = json.load(f)
          shard_indices = []
          shard_configs = []
          for i in range(shards):
              s = start + i * shard_size
              e = min(start + (i+1)*shard_size - 1, end)
              shard_indices.append(str(i))
              cfg = orig.copy()
              cfg["start_cid"] = s
              cfg["end_cid"] = e
              cfg["should_scan"] = True
              shard_configs.append(cfg)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"shard_list={json.dumps(shard_indices)}\n")
              out.write(f"shard_configs={json.dumps(shard_configs)}\n")
          EOF

  scan_shard_first:
    needs: master
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.master.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成当前分片的 config.json
        run: |
          # 使用 jq 提取配置，避免复杂的 GitHub 表达式
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" > config.json
          cat config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 缓存 Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
      - name: 安装依赖
        run: |
          pip install playwright psutil
          playwright install chromium
      - name: 运行扫描
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: python scanner_playwright.py
      - name: 上传有效结果
        uses: actions/upload-artifact@v4
        with:
          name: first-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: 上传未完成标志
        uses: actions/upload-artifact@v4
        with:
          name: flag-${{ matrix.shard_idx }}
          path: unfinished_${{ matrix.shard_idx }}.flag
          if-no-files-found: ignore
          retention-days: 1

  collect_unfinished:
    needs: scan_shard_first
    runs-on: ubuntu-latest
    outputs:
      retry_list: ${{ steps.retry.outputs.retry_list }}
    steps:
      - name: 下载所有未完成标志
        uses: actions/download-artifact@v4
        with:
          pattern: flag-*
          path: flags
          merge-multiple: false
      - name: 解析需要重跑的分片索引
        id: retry
        run: |
          retry_indices=""
          for dir in flags/flag-*/; do
            if [ -d "$dir" ] && [ -f "$dir/unfinished_"* ]; then
              idx=$(basename "$dir" | sed 's/flag-//')
              retry_indices="${retry_indices},${idx}"
            fi
          done
          retry_indices=$(echo "$retry_indices" | sed 's/^,//')
          if [ -z "$retry_indices" ]; then
            echo "retry_list=[]" >> $GITHUB_OUTPUT
          else
            # 转换为 JSON 数组
            retry_list=$(echo "$retry_indices" | jq -R 'split(",")')
            echo "retry_list=${retry_list}" >> $GITHUB_OUTPUT
          fi

  scan_shard_second:
    needs: [master, collect_unfinished]
    if: fromJson(needs.collect_unfinished.outputs.retry_list).length > 0
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard_idx: ${{ fromJson(needs.collect_unfinished.outputs.retry_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成补扫分片的 config.json
        run: |
          echo '${{ needs.master.outputs.shard_configs }}' | jq -c ".[${{ matrix.shard_idx }}]" | jq '. + {should_scan: true}' > config.json
          cat config.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 恢复 Playwright 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
      - name: 安装依赖
        run: |
          pip install playwright psutil
          playwright install chromium
      - name: 运行补扫
        env:
          PYTHONUNBUFFERED: 1
          SHARD_IDX: ${{ matrix.shard_idx }}
        run: python scanner_playwright.py
      - name: 上传补扫结果
        uses: actions/upload-artifact@v4
        with:
          name: second-ok-shard-${{ matrix.shard_idx }}
          path: data/*.txt
          if-no-files-found: warn
          retention-days: 1

  final_upload:
    needs: [scan_shard_first, scan_shard_second]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载所有有效结果
        uses: actions/download-artifact@v4
        with:
          pattern: '*-ok-*'
          path: all_results
          merge-multiple: true
      - name: 合并并拆分结果文件
        run: |
          mkdir -p final_data
          find all_results -name "*.txt" | while read file; do
            base=$(basename "$file" .txt)
            awk -v prefix="final_data/${base}_" 'NR%600==1 {file=prefix ++c ".txt"} {print > file}' "$file"
          done
      - name: 提交到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final_data/
          git commit -m "最终扫描结果（自动重跑） [skip ci]" || echo "无变更"
          git push
