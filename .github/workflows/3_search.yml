name: "Workflow 2: 数据库检索提取 (Search -> main/search/)"

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '搜索关键词 (多个关键词请用空格分隔)'
        required: true
      match_mode:
        description: '匹配逻辑 (针对多关键词)'
        required: true
        type: choice
        options:
          - '严格且 (AND - 必须同时包含所有词)'
          - '通配或 (OR - 包含任意一个词即可)'
          - '连贯原样 (EXACT - 完整匹配这一长串字)'

permissions:
  contents: write

jobs:
  search_database:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前主分支 (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 临时提取数据中台 (data 分支) 的数据
        run: |
          mkdir -p /tmp/db_data
          # 仅将 origin/data 远程分支下的 data/ 文件夹检出到临时目录
          if git checkout origin/data -- data/ 2>/dev/null; then
            mv data/*.txt /tmp/db_data/ 2>/dev/null || true
            echo "✅ 成功提取 data 分支数据库"
          else
            echo "❌ 错误：未找到归档的 data 分支或数据为空，请先运行入库工作流！"
            exit 1
          fi
          
          # 恢复本地工作区状态，确保呆在当前主分支
          git checkout ${{ github.ref_name }}

      - name: 启动检索引擎并切分文件
        env:
          KEYWORD: ${{ github.event.inputs.keyword }}
          MATCH_MODE: ${{ github.event.inputs.match_mode }}
        run: |
          python << 'EOF'
          import os, glob, sys, shutil

          keyword_str = os.environ.get("KEYWORD", "").strip()
          match_mode = os.environ.get("MATCH_MODE", "")

          print(f"🔍 搜索关键词: '{keyword_str}'")
          print(f"⚙️ 匹配逻辑: {match_mode}")

          if not keyword_str:
              print("❌ 错误：搜索关键词为空。")
              sys.exit(1)

          # 智能解析模式
          if "AND" in match_mode:
              mode = "AND"
              keywords = keyword_str.split()
          elif "OR" in match_mode:
              mode = "OR"
              keywords = keyword_str.split()
          else:
              mode = "EXACT"
              keywords = [keyword_str]

          results = []
          db_dir = "/tmp/db_data"
          
          # 遍历临时数据库进行快速全扫描
          if os.path.exists(db_dir):
              for f in sorted(glob.glob(f"{db_dir}/*.txt")):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          text = line.strip()
                          if not text: continue

                          # 核心比对器
                          if mode == "AND":
                              if all(k in text for k in keywords): results.append(text)
                          elif mode == "OR":
                              if any(k in text for k in keywords): results.append(text)
                          elif mode == "EXACT":
                              if keywords[0] in text: results.append(text)

          # 强制刷新当前分支下的 search 文件夹
          output_dir = "search"
          if os.path.exists(output_dir):
              shutil.rmtree(output_dir)
          os.makedirs(output_dir, exist_ok=True)
          
          total_hits = len(results)

          if total_hits == 0:
              print("\n⚠️ 抱歉，未找到匹配记录。")
              with open(f"{output_dir}/0_未找到记录.txt", "w", encoding="utf-8") as f:
                  f.write(f"在数据库中未找到与 '{keyword_str}' 匹配的任何班级记录。\n")
          else:
              print(f"\n🎉 检索成功！共命中 {total_hits} 条数据，开始写入 search 文件夹...")
              
              # 严格遵循 600 行一个文件的安全输出规则
              chunk_size = 600
              for i in range(0, total_hits, chunk_size):
                  chunk = results[i:i+chunk_size]
                  file_idx = (i // chunk_size) + 1
                  
                  # 截取安全的关键词作为文件名前缀
                  safe_kw = keywords[0][:10].replace('/', '_').replace('\\', '_').replace(' ', '_')
                  filename = f"{output_dir}/{safe_kw}_{file_idx:03d}.txt"
                  
                  with open(filename, 'w', encoding='utf-8') as f:
                      for line in chunk:
                          f.write(line + "\n")
                          
              print(f"✅ 文件切分写入完成，共生成 {file_idx} 个结果文件。")
          EOF
          
      - name: 提交 search 文件夹并推送到当前分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制将整个 search 文件夹添加到暂存区
          git add search/
          
          # 动态获取时间及关键词用于 commit 记录
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          SAFE_KW=$(echo "${{ github.event.inputs.keyword }}" | head -c 20)
          
          if git commit -m "🔍 检索归档完成: [$SAFE_KW] 产生于 $COMMIT_TIME"; then
            git push origin ${{ github.ref_name }}
            echo "🎉 搜索结果已成功推送到主分支的 search/ 文件夹下，请刷新网页查看！"
          else
            echo "⚠️ 搜索结果与上一次完全一致，无代码变更需要推送。"
          fi
