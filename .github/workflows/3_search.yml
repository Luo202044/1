name: "Workflow 2: 数据库检索提取 (Search -> main/search/)"

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '搜索关键词 (多个关键词请用空格分隔)'
        required: true
      match_mode:
        description: '匹配逻辑 (针对多关键词)'
        required: true
        type: choice
        options:
          - '通配或 (OR - 包含任意一个词即可)'
          - '严格且 (AND - 必须同时包含所有词)'
          - '连贯原样 (EXACT - 完整匹配这一长串字)'
          - '批量绝对相等 (BATCH - 专门用于大批量完整 CID 提取)'
      target_mode:
        description: '扫描雷达 (精确定位搜索区域)'
        required: true
        type: choice
        options:
          - '查 学校/班级 (排除 CID 干扰，最常用！)'
          - '查 教师 (专属雷达)'
          - '精准查 CID(批量) (只包含匹配即可)'
          - '全局模糊 (全文任何位置包含均可)'

permissions:
  contents: write

jobs:
  search_database:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前主分支
        uses: actions/checkout@v4
        
      - name: 隔离检出数据库 (完美杜绝 Index 污染)
        uses: actions/checkout@v4
        with:
          ref: data
          path: temp_db_repo
          
      - name: 启动检索引擎并切分文件
        env:
          KEYWORD: ${{ github.event.inputs.keyword }}
          MATCH_MODE: ${{ github.event.inputs.match_mode }}
          TARGET_MODE: ${{ github.event.inputs.target_mode }}
        run: |
          python << 'EOF'
          import os, glob, sys, shutil

          keyword_str = os.environ.get("KEYWORD", "").strip()
          match_mode = os.environ.get("MATCH_MODE", "")
          target_mode = os.environ.get("TARGET_MODE", "")

          print(f"🔍 搜索关键词: '{keyword_str}'")
          print(f"⚙️ 匹配逻辑: {match_mode}")
          print(f"🎯 扫描雷达: {target_mode}")

          if not keyword_str:
              print("❌ 错误：搜索关键词为空。")
              sys.exit(1)

          # --- 智能模式解析 ---
          if "AND" in match_mode:
              mode = "AND"
              keywords = keyword_str.split()
          elif "OR" in match_mode:
              mode = "OR"
              keywords = keyword_str.split()
          elif "BATCH" in match_mode:
              mode = "BATCH"
              keywords = keyword_str.split()
          else:
              mode = "EXACT"
              keywords = [keyword_str]

          results = []
          db_dir = "temp_db_repo/data"
          
          if os.path.exists(db_dir):
              txt_files = glob.glob(f"{db_dir}/*/*.txt") + glob.glob(f"{db_dir}/*.txt")
              
              for f in sorted(txt_files):
                  with open(f, 'r', encoding='utf-8') as file:
                      for line in file:
                          text = line.strip()
                          if not text: continue

                          # 【高级字段切分】：优先尝试使用 \t 切分最新版数据
                          parts = text.split('\t')
                          if len(parts) >= 5:
                              cid = parts[0]
                              url = parts[1]
                              school = parts[2]
                              teacher = parts[3]
                              class_name = parts[4]
                              content_text = f"{school} {teacher} {class_name}" # 兜底用的纯文本
                          else:
                              # 兼容历史遗留的旧版空格数据
                              parts_space = text.split(maxsplit=1)
                              cid = parts_space[0] if len(parts_space) > 0 else ""
                              url = f"https://www.eeo.cn/s/a/?cid={cid}"
                              content_text = text.replace(f"{cid} {url} ", "", 1)
                              school = ""
                              teacher = ""
                              class_name = content_text

                          # ---------------- 智能定向雷达 ----------------
                          if "精准查 CID" in target_mode:
                              search_text = cid
                          elif "查 教师" in target_mode:
                              # 如果是新版数据，精确锁定 teacher 字段；如果是旧数据，在后面全部内容中找
                              search_text = teacher if teacher else content_text
                          elif "查 学校/班级" in target_mode:
                              search_text = f"{school} {class_name}" if school else content_text
                          else:
                              search_text = text # 全局模糊

                          # ---------------- 核心匹配引擎 ----------------
                          is_match = False
                          
                          if mode == "BATCH":
                              # 批量绝对相等匹配（防止搜 305 误杀 305123）
                              if cid in keywords:
                                  is_match = True
                          elif mode == "AND":
                              is_match = all(k in search_text for k in keywords)
                          elif mode == "OR":
                              is_match = any(k in search_text for k in keywords)
                          elif mode == "EXACT":
                              is_match = keywords[0] in search_text

                          if is_match:
                              results.append(text)

          output_dir = "search"
          if os.path.exists(output_dir):
              shutil.rmtree(output_dir)
          os.makedirs(output_dir, exist_ok=True)
          
          total_hits = len(results)

          if total_hits == 0:
              print("\n⚠️ 抱歉，未找到匹配记录。")
              with open(f"{output_dir}/0_未找到记录.txt", "w", encoding="utf-8") as f:
                  f.write(f"在数据库中未找到与 '{keyword_str}' 匹配的任何班级记录。\n")
          else:
              print(f"\n🎉 检索成功！共命中 {total_hits} 条数据，开始写入 search 文件夹...")
              
              chunk_size = 600
              for i in range(0, total_hits, chunk_size):
                  chunk = results[i:i+chunk_size]
                  file_idx = (i // chunk_size) + 1
                  
                  safe_kw = keywords[0][:10].replace('/', '_').replace('\\', '_').replace(' ', '_')
                  filename = f"{output_dir}/{safe_kw}_{file_idx:03d}.txt"
                  
                  with open(filename, 'w', encoding='utf-8') as f:
                      for line in chunk:
                          f.write(line + "\n")
                          
              print(f"✅ 文件切分写入完成，共生成 {file_idx} 个结果文件。")
          EOF
          
      - name: 销毁临时数据仓库 (阅后即焚)
        run: rm -rf temp_db_repo
          
      - name: 提交 search 文件夹并推送到当前分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add search/
          
          COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          SAFE_KW=$(echo "${{ github.event.inputs.keyword }}" | head -c 20)
          
          if git commit -m "🔍 检索归档完成: [$SAFE_KW] 产生于 $COMMIT_TIME"; then
            git push origin ${{ github.ref_name }}
            echo "🎉 搜索结果已成功推送，请刷新网页查看！"
          else
            echo "⚠️ 搜索结果与上一次完全一致，无代码变更需要推送。"
          fi
